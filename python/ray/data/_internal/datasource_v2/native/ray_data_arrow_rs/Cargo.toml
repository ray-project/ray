[package]
name = "ray_data_arrow_rs"
version = "0.1.0"
edition = "2021"
description = "Experimental arrow-rs Parquet reader for Ray Data (prototype)"

[lib]
name = "ray_data_arrow_rs"
# cdylib for the Python extension module; rlib so the logic can be unit-tested
# from Rust too.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pin to the same major the surviving standalone benchmark used, so behavior
# matches the numbers in Agents.md. object_store MUST match the version parquet
# pins (0.13.x) or ParquetObjectReader's API won't line up.
# `crc`: verify each data page's stored CRC32 during decode (decode_page in
# parquet's serialized_reader, used by BOTH the sync/local and async/S3 paths).
# Compile-time only — there is no runtime toggle — and a no-op for pages that
# don't store a CRC (pyarrow doesn't write them by default). Enables native
# support for `page_checksum_verification=True`; an explicit `False` (read
# *despite* bad checksums) still falls back to PyArrow, the only reader that
# can skip the check.
parquet = { version = "59", features = ["arrow", "async", "object_store", "crc"] }
# Only the `ffi` feature — we hand batches to Python via the Arrow C-stream
# (FFI_ArrowArrayStream + PyCapsule), NOT arrow's `pyarrow` conversions. Pulling
# `pyarrow` would drag in arrow-pyarrow → pyo3 0.28, conflicting with our pyo3 0.22.
arrow = { version = "59", features = ["ffi"] }
object_store = { version = "0.13", features = ["aws"] }
# `extension-module` is behind a default feature so `cargo test` can run the
# pure-Rust unit tests (predicate pruning) by linking libpython:
#   cargo test --no-default-features
# maturin builds with default features on, so the shipped extension is unchanged.
pyo3 = { version = "0.22", features = ["abi3-py39"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
# Already in the tree via parquet/object_store; direct dep only so the
# column-prefetch path can hold/slice fetched buffers (`Bytes` is refcounted,
# so slices share the underlying allocation — no copies).
bytes = "1"
# Predicate IR is passed from Python as a small JSON string (built from the Ray
# `Expr` AST) and parsed here into a `Pred` tree for row-group stats pruning.
# JSON keeps the boundary language-agnostic and lets the pruning logic be
# unit-tested in pure Rust with string literals (no parquet fixtures needed).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# No optional allocator features: an allocator-retention theory was tested and
# disproven (Agents.md §3.5.1/§7.8) — the system allocator is correct here, and
# mimalloc-as-global-allocator segfaulted Ray workers across the FFI boundary.
# Allocator A/B experiments use LD_PRELOAD, which needs no crate support.

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
