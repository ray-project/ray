search-path = ["python"]

# Equivalent of mypy --ignore-missing-imports: generated/compiled modules whose
# names only exist at runtime, plus third-party deps that are not installed in
# the pre-commit env.
replace-imports-with-any = [
    "ray._raylet",
    "ray.serve.generated",
    "ray.serve.generated.*",
    "ray.core.generated",
    "ray.core.generated.*",
    "fastapi.*",
    "grpc.*",
    "memray",
    "opentelemetry.*",
    "numpy",
    "orjson",
    "ormsgpack",
    "packaging.*",
    "pandas",
    "pydantic.*",
    "redis",
    "requests",
    "starlette.*",
    "tornado.*",
    "uvicorn.*",
]
