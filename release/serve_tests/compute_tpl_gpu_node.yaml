cloud: {{env["ANYSCALE_CLOUD_NAME"]}}

advanced_instance_config:
  TagSpecifications:
    - ResourceType: "instance"
      Tags:
        - Key: ttl-hours
          Value: '24'

head_node:
    instance_type: g4dn.4xlarge
    # GPU head — explicitly expose the instance's natural 16 vCPU + 1 GPU so the
    # test driver (on the head) can actually run GPU workloads.
    resources:
      CPU: 16
      GPU: 1

# One optional 16-CPU / 64 GiB x86 worker. Anyscale launches the first group
# in `group_order` and moves to the next group in the same zone when a launch
# fails for lack of capacity.
worker_nodes:
    # 16 cpus, x86 (Intel Sapphire Rapids), 64G mem. Preferred type.
    - name: worker-m7i
      instance_type: m7i.4xlarge
      min_nodes: 0
      max_nodes: 1
      market_type: ON_DEMAND
    # Fallbacks: same shape, used only when the groups above cannot launch.
    # 16 cpus, x86 (Intel Ice Lake), 64G mem
    - name: worker-m6i
      instance_type: m6i.4xlarge
      min_nodes: 0
      max_nodes: 1
      market_type: ON_DEMAND
    # 16 cpus, x86 (Intel Skylake/Cascade Lake), 64G mem
    - name: worker-m5
      instance_type: m5.4xlarge
      min_nodes: 0
      max_nodes: 1
      market_type: ON_DEMAND
    # 16 cpus, x86 (AMD EPYC Milan), 64G mem
    - name: worker-m6a
      instance_type: m6a.4xlarge
      min_nodes: 0
      max_nodes: 1
      market_type: ON_DEMAND

# Keeps the pool at one worker in total rather than one per group: 16 CPUs
# for the head plus 16 for a single worker.
max_resources:
  CPU: 32

flags:
  instance_ranking_strategy:
    - ranker_type: custom_group_order
      ranker_config:
        group_order: [worker-m7i, worker-m6i, worker-m5, worker-m6a]
