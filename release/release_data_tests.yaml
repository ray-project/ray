###############
# Groupby tests
###############

# The groupby tests use the TPC-H lineitem table. Here are the columns used for the
# groupbys and their corresponding TPC-H column names:
#
# | Our dataset     | TPC-H column name |
# |-----------------|-------------------|
# | column02        | l_suppkey         |
# | column08        | l_returnflag      |
# | column13        | l_shipinstruct    |
# | column14        | l_shipmode        |
#
# Here are the number of groups for different groupby columns in SF 1000:
#
# | Groupby columns                  | Number of groups |
# |----------------------------------|------------------|
# | column08, column13, column14     | 84               |
# | column02, column14               | 7,000,000        |
#
# The SF (scale factor) 1000 lineitem table contains ~6B rows.

# TODO: Bump the scale from SF10 to SF1000 once we handle the scale.

- name: "aggregate_groups_{{scaling}}_{{shuffle_strategy}}_{{columns}}"
  python: "3.10"
  # The bin budget is per-variant rather than per-block: only
  # fixed_size/sort_shuffle/84-groups needed retuning, and the other seven were
  # measured healthy at 32 MiB, so they stay there rather than move onto an
  # unmeasured value. ``setup`` is left empty and every combination is
  # enumerated in ``adjustments`` so each can carry its own budget.
  #
  # Baseline for the eight sort_shuffle/hash_shuffle variants is release build
  # #102329 (32 MiB everywhere) against master build #102323. The four
  # hash_shuffle_v2 variants came from master after that build and have no
  # measurement here yet.
  #
  # | variant                          | 32 MiB | master |      delta |
  # |----------------------------------|--------|--------|------------|
  # | fixed_size / sort / 84 groups    | 215.7s | 145.0s |     +48.8% |
  # | autoscaling / sort / 84 groups   | 463.6s | 420.7s |     +10.2% |
  # | autoscaling / hash / 84 groups   | 208.8s | 201.9s |      +3.4% |
  # | autoscaling / hash / 7M groups   | 2216.7s| 2208.7s|      +0.4% |
  # | fixed_size / hash / 84 groups    |  19.3s |  19.8s |      -2.7% |
  # | fixed_size / hash / 7M groups    | 663.5s | 771.2s |     -14.0% |
  # | fixed_size / sort / 7M groups    | 550.7s | 651.7s |     -15.5% |
  # | autoscaling / sort / 7M groups   | 716.6s |1033.8s |     -30.7% |
  matrix:
    setup:
      scaling: []
      shuffle_strategy: []
      columns: []
      bin_packing_bytes: []
    adjustments:
      # 256 MiB (4x the default): the one variant that needed retuning. It sat
      # at 211s in #102329 on 32 MiB and 220-259s on smaller budgets, against
      # master's ~145s; 256 MiB brings it to 137s, at or just under master.
      #
      # What's being tuned away is per-block sort-shuffle overhead, not bytes.
      # At 32 MiB the scan emitted 4x the ``ListFiles`` outputs and ~1.5x the
      # blocks into the shuffle (Sort Sample 3050 vs master's 2000) for an
      # identical 20.8GB object-store peak and identical row count. With only
      # 84 reduce partitions, block count is what dominates -- so this variant
      # wants the same direction as ``map_groups`` (1.25 GiB on this same
      # dataset), just less far.
      - with:
          scaling: fixed_size
          shuffle_strategy: sort_shuffle_pull_based
          columns: "column08 column13 column14"   # 84 groups
          bin_packing_bytes: 268435456
      # The remaining seven stay at 32 MiB, where they were measured. None is a
      # tuned optimum -- they are a known-acceptable state, and 256 MiB is
      # unmeasured for all of them. Worth a sweep given how far it moved the
      # variant above, but not worth assuming.
      - with:
          scaling: fixed_size
          shuffle_strategy: sort_shuffle_pull_based
          columns: "column02 column14"   # 7M groups
          bin_packing_bytes: 33554432
      - with:
          scaling: fixed_size
          shuffle_strategy: hash_shuffle
          columns: "column08 column13 column14"
          bin_packing_bytes: 33554432
      - with:
          scaling: fixed_size
          shuffle_strategy: hash_shuffle
          columns: "column02 column14"
          bin_packing_bytes: 33554432
      - with:
          scaling: autoscaling
          shuffle_strategy: sort_shuffle_pull_based
          columns: "column08 column13 column14"
          bin_packing_bytes: 33554432
      - with:
          scaling: autoscaling
          shuffle_strategy: sort_shuffle_pull_based
          columns: "column02 column14"
          bin_packing_bytes: 33554432
      - with:
          scaling: autoscaling
          shuffle_strategy: hash_shuffle
          columns: "column08 column13 column14"
          bin_packing_bytes: 33554432
      - with:
          scaling: autoscaling
          shuffle_strategy: hash_shuffle
          columns: "column02 column14"
          bin_packing_bytes: 33554432
      # ``hash_shuffle_v2`` arrived from master and has never run on this
      # branch, so there is no measurement to carry over. Left at the 64 MiB
      # branch default rather than inheriting the 32 MiB above, which was a
      # deliberate pin for the variants that had been measured at it.
      - with:
          scaling: fixed_size
          shuffle_strategy: hash_shuffle_v2
          columns: "column08 column13 column14"
          bin_packing_bytes: 67108864
      - with:
          scaling: fixed_size
          shuffle_strategy: hash_shuffle_v2
          columns: "column02 column14"
          bin_packing_bytes: 67108864
      - with:
          scaling: autoscaling
          shuffle_strategy: hash_shuffle_v2
          columns: "column08 column13 column14"
          bin_packing_bytes: 67108864
      - with:
          scaling: autoscaling
          shuffle_strategy: hash_shuffle_v2
          columns: "column02 column14"
          bin_packing_bytes: 67108864
  cluster:
    anyscale_sdk_2026: true
    byod:
      runtime_env:
        - RAY_DATA_DEBUG_RESOURCE_MANAGER=1
        - RAYTEST_FAIL_ON_WORKER_OOM=1
        - RAYTEST_FAIL_ON_DEAD_NODES=1
        - RAYTEST_FAIL_ON_SPILLING=0
        - RAY_DATA_PARQUET_BIN_PACKING_BYTES={{bin_packing_bytes}}
    cluster_compute: "{{scaling}}_all_to_all_compute.yaml"

  run:
    timeout: 3600
    script: >
      python groupby_benchmark.py --sf 100 --aggregate --group-by {{columns}}
      --shuffle-strategy {{shuffle_strategy}}


- name: "map_groups_{{scaling}}_{{shuffle_strategy}}_{{columns}}"
  python: "3.10"
  matrix:
    setup:
      scaling: [fixed_size, autoscaling]
      shuffle_strategy: [sort_shuffle_pull_based, hash_shuffle, hash_shuffle_v2]
      columns:
        - "column08 column13 column14"   # 84 groups
        - "column02 column14"  # 7M groups

  cluster:
    anyscale_sdk_2026: true
    byod:
      runtime_env:
        - RAY_DATA_DEBUG_RESOURCE_MANAGER=1
        - RAYTEST_FAIL_ON_WORKER_OOM=1
        - RAYTEST_FAIL_ON_DEAD_NODES=1
        - RAYTEST_FAIL_ON_SPILLING=0
        # Same sf100 lineitem full-schema read as the aggregate variants; see
        # the note there for why 1.25 GiB.
        - RAY_DATA_PARQUET_BIN_PACKING_BYTES=1342177280
    cluster_compute: "{{scaling}}_all_to_all_compute.yaml"

  run:
    timeout: 3600
    script: >
      python groupby_benchmark.py --sf 100 --map-groups --group-by {{columns}}
      --shuffle-strategy {{shuffle_strategy}}

###############
# Join tests
###############

# NOTE:
# Joining on Benchmark TPCH parquet datasets
# Left dataset 'LINEITEM' = SF*6M rows
# Right dataset 'ORDERS' = SF*1.5M rows
# Join key = 'l_orderkey', 'o_orderkey' respectively from 'LINEITEM', 'ORDERS' dataset. In the generated dataset,
# * For 'LINEITEM' dataset, 'column_00' corresponds to l_orderkey
# * For 'ORDERS' dataset, 'column_0' corresponds to o_orderkey.
# Join type = inner, left_join, right_join and full_join
#
# Dataset TPCH Scale Factor (SF) for CSV files. Note that parquet files will be low smaller with column compression.
# SF1 = 1GB
# SF10 = 10GB
# SF100 = 100GB
# SF1000 = 1TB
# SF10000 = 10TB
#
# Do adjust timeout below based on SF above.
#

- name: joins_{{dataset}}_{{join_type}}
  python: "3.10"
  cluster:
    anyscale_sdk_2026: true
    byod:
      runtime_env:
        - RAY_DATA_DEBUG_RESOURCE_MANAGER=1
        - RAYTEST_FAIL_ON_WORKER_OOM=1
        - RAYTEST_FAIL_ON_DEAD_NODES=1
        - RAYTEST_FAIL_ON_SPILLING=0
        # Both sides are read with their full schema: ~1.17 GiB uncompressed
        # per lineitem file. 1.25 GiB packs ~one file per bin (~95 read tasks
        # vs the 100 blocks master's round-robin partitioner produced).
        - RAY_DATA_PARQUET_BIN_PACKING_BYTES=1342177280
    cluster_compute: fixed_size_100_cpu_compute.yaml

  matrix:
    setup:
      dataset: [sf100]
      join_type: [inner, left_outer, right_outer, full_outer]

  run:
    timeout: 3600
    script: >
      python join_benchmark.py
      --left_dataset s3://ray-benchmark-data/tpch/parquet/{{dataset}}/lineitem
      --right_dataset s3://ray-benchmark-data/tpch/parquet/{{dataset}}/orders
      --left_join_keys column00
      --right_join_keys column0
      --join_type {{join_type}}
      --num_partitions 50

###############
# Wide Schema tests
###############

# NOTE: `primitives` and `tensors` are spelled out rather than folded into the
# matrix below because each wants its own bin budget, and a matrix takes the
# cartesian product of its lists (see the read_large_parquet NOTE above). Their
# names match the matrix-generated ones exactly so baseline history is unbroken.
#
# The bin budget is compared against row-group `total_byte_size` -- data-page
# bytes only, post-encoding. For these 5000-column datasets that is a poor proxy
# for the work a read task does: `primitives` files are 21.4 MiB on S3 but
# report only 0.45 MiB, because dictionary + RLE collapses the repeated 500-char
# values and the real weight is dictionary pages plus a 5000-column footer
# carrying per-chunk min/max statistics.
- name: wide_schema_pipeline_primitives
  python: "3.10"
  cluster:
    anyscale_sdk_2026: true
    byod:
      runtime_env:
        # Preserve the default verbose stats for resource manager.
        - RAY_DATA_DEBUG_RESOURCE_MANAGER=1
        - RAYTEST_FAIL_ON_WORKER_OOM=1
        - RAYTEST_FAIL_ON_DEAD_NODES=1
        - RAYTEST_FAIL_ON_SPILLING=1
        # S3 tensor data was written by Ray 2.49-2.54 using cloudpickle.
        - RAY_DATA_AUTOLOAD_CLOUDPICKLE_TENSOR_METADATA=1
        # 27 single-row-group files reporting 0.45 MiB each: at the 64 MiB
        # default all 27 land in one shared bin, so the whole 579 MiB dataset
        # reads as a single task. 256 KiB is below one row group, so each gets
        # its own bin (indivisible-oversize relaxation in OnlineBinPacker._place)
        # -> 27 tasks, the ceiling while row groups stay atomic.
        - RAY_DATA_PARQUET_BIN_PACKING_BYTES=262144
        #
        # 27 actors x batch size 1 == one footer read per actor, so all 27
        # footers are read in a single concurrent wave. Worth the extra actor
        # startup here because these footers are unusually expensive: 5000
        # column chunks each carrying 500-char min/max statistics.
        - RAY_DATA_PARQUET_FOOTER_NUM_ACTORS=27
        - RAY_DATA_PARQUET_FOOTER_BATCH_SIZE=1
        - RAY_DATA_PARQUET_READER_IO_THREAD_COUNT=5000
    cluster_compute: fixed_size_cpu_compute.yaml

  run:
    timeout: 300
    script: >
      python wide_schema_pipeline_benchmark.py
      --data-type primitives

- name: wide_schema_pipeline_tensors
  python: "3.10"
  cluster:
    anyscale_sdk_2026: true
    byod:
      runtime_env:
        # Preserve the default verbose stats for resource manager.
        - RAY_DATA_DEBUG_RESOURCE_MANAGER=1
        - RAYTEST_FAIL_ON_WORKER_OOM=1
        - RAYTEST_FAIL_ON_DEAD_NODES=1
        - RAYTEST_FAIL_ON_SPILLING=1
        # S3 tensor data was written by Ray 2.49-2.54 using cloudpickle.
        - RAY_DATA_AUTOLOAD_CLOUDPICKLE_TENSOR_METADATA=1
        # 39 MiB sits just above these 37.25 MiB row groups, so one fills a bin
        # and the next cannot join it -- one row group per read task, same
        # placement the 64 MiB default already produced via its two-per-bin
        # threshold, but pinned so it survives a change to the default.
        - RAY_DATA_PARQUET_BIN_PACKING_BYTES=40894464
        #
        # These datasets are small enough that the footer-reader pool is pure
        # startup cost; keep it narrow and spread the few files across it.
        - RAY_DATA_PARQUET_FOOTER_NUM_ACTORS=22
        - RAY_DATA_PARQUET_FOOTER_BATCH_SIZE=1
        - RAY_DATA_PARQUET_READER_IO_THREAD_COUNT=5000
    cluster_compute: fixed_size_cpu_compute.yaml

  run:
    timeout: 300
    script: >
      python wide_schema_pipeline_benchmark.py
      --data-type tensors

- name: wide_schema_pipeline_nested_structs
  python: "3.10"
  cluster:
    anyscale_sdk_2026: true
    byod:
      runtime_env:
        # Preserve the default verbose stats for resource manager.
        - RAY_DATA_DEBUG_RESOURCE_MANAGER=1
        - RAYTEST_FAIL_ON_WORKER_OOM=1
        - RAYTEST_FAIL_ON_DEAD_NODES=1
        - RAYTEST_FAIL_ON_SPILLING=1
        # S3 tensor data was written by Ray 2.49-2.54 using cloudpickle.
        - RAY_DATA_AUTOLOAD_CLOUDPICKLE_TENSOR_METADATA=1
        # 21 single-row-group files reporting 1.30 MiB each: at the 64 MiB
        # default all 21 land in one shared bin and the dataset reads as a
        # single task. 2 MiB is the widest budget that still keeps one file per
        # bin -- two would need 2.6 MiB -- so this is 21 tasks, the ceiling
        # while row groups stay atomic.
        - RAY_DATA_PARQUET_BIN_PACKING_BYTES=2097152
        #
        # 21 actors x batch size 1 == one footer read per actor, so all 21
        # footers are read in a single concurrent wave -- same shape as
        # `primitives`. Worth the extra actor startup here because these
        # footers are unusually expensive: 15000 column chunks each carrying
        # min/max statistics.
        - RAY_DATA_PARQUET_FOOTER_NUM_ACTORS=21
        - RAY_DATA_PARQUET_FOOTER_BATCH_SIZE=1
        - RAY_DATA_PARQUET_READER_IO_THREAD_COUNT=5000
    cluster_compute: fixed_size_cpu_compute.yaml

  run:
    timeout: 300
    script: >
      python wide_schema_pipeline_benchmark.py
      --data-type nested_structs

- name: wide_schema_pipeline_objects
  python: "3.10"
  cluster:
    anyscale_sdk_2026: true
    byod:
      runtime_env:
        # Preserve the default verbose stats for resource manager.
        - RAY_DATA_DEBUG_RESOURCE_MANAGER=1
        - RAYTEST_FAIL_ON_WORKER_OOM=1
        - RAYTEST_FAIL_ON_DEAD_NODES=1
        - RAYTEST_FAIL_ON_SPILLING=1
        # S3 tensor data was written by Ray 2.49-2.54 using cloudpickle.
        - RAY_DATA_AUTOLOAD_CLOUDPICKLE_TENSOR_METADATA=1
        # 9 single-row-group files of 4.23 MiB: at the 64 MiB default all 9 land
        # in one shared bin and the dataset reads as a single task. 4.20 MiB sits
        # just under one row group, so each is oversized and gets its own bin;
        # the smallest possible pair (2 x 2.71 MiB) also exceeds it, so no two
        # files ever share -> 9 tasks, the ceiling while row groups stay atomic.
        - RAY_DATA_PARQUET_BIN_PACKING_BYTES=4404020
        #
        # 9 actors x batch size 1 == one footer read per actor, so all 9 footers
        # are read in a single concurrent wave -- same shape as the other three.
        - RAY_DATA_PARQUET_FOOTER_NUM_ACTORS=9
        - RAY_DATA_PARQUET_FOOTER_BATCH_SIZE=1
        - RAY_DATA_PARQUET_READER_IO_THREAD_COUNT=5000
    cluster_compute: fixed_size_cpu_compute.yaml

  run:
    timeout: 300
    script: >
      python wide_schema_pipeline_benchmark.py
      --data-type objects

#######################
# Streaming split tests
#######################

- name: streaming_split
  python: "3.10"
  cluster:
    anyscale_sdk_2026: true
    byod:
      runtime_env:
        # imagenet parquet: 7416 single-row-group files of ~8.15 MiB, listed on
        # one task. ListFiles dominates this test, and its cost tracks the number
        # of results the driver pulls back rather than the footer IO itself: at
        # the default result batch of 1 the listing task pays one object-store
        # fetch per file (7.4k of them). Batching 50 files per actor call and per
        # streamed result cuts that to ~149 fetches.
        - RAY_DATA_PARQUET_FOOTER_BATCH_SIZE=50
        - RAY_DATA_PARQUET_FOOTER_RESULT_BATCH_SIZE=50
        # imagenet does not compress (uncompressed/on-disk = 1.00), so master's
        # round-robin partitioner over-counted by 5x -- it sizes on-disk bytes
        # through a fixed 5x encoding estimate -- and it landed on
        # ~4 files (~31 MB) per block. Matching that granularity was tried at
        # 36 MiB and made things worse -- it doubles the block count, and block
        # generation is ~4 ms per manifest block. Left at the default.
        - RAY_DATA_PARQUET_BIN_PACKING_BYTES=67108864
  run:
    timeout: 300
    wait_for_nodes:
      num_nodes: 10

  variations:
    - __suffix__: regular
      run:
        script: python streaming_split_benchmark.py --num-workers 10

    - __suffix__: regular_equal
      run:
        script: python streaming_split_benchmark.py --num-workers 10 --equal-split

    - __suffix__: early_stop
      # This test case will early stop the data ingestion iteration on the GPU actors.
      # This is a common usage in PyTorch Lightning
      # (https://lightning.ai/docs/pytorch/stable/common/trainer.html#limit-train-batches).
      # There was a bug in Ray Data that caused GPU memory leak (see #34819).
      # We add this test case to cover this scenario.
      run:
        script: python streaming_split_benchmark.py --num-workers 10 --early-stop

############
# Mix tests
############

- name: mix
  python: "3.10"
  cluster:
    anyscale_sdk_2026: true
    byod:
      runtime_env:
        # No bin budget override: at the default this dataset (513 single-row-
        # group files of ~88 MB) already packs ~one file per bin, matching the
        # granularity master's round-robin partitioner produced.
        #
        # This benchmark opens 8 datasets over the same path, so the footer
        # path costs 8 x 513 footer reads and 8 x 32 reader actors -- work
        # master never did, and enough to dominate the ~40s `random_mix`
        # variants.
        # Narrow the pool; the per-actor IO concurrency still covers 513 files.
        - RAY_DATA_PARQUET_FOOTER_NUM_ACTORS=4
    cluster_compute: dataset_mixing/compute_8_cpu.yaml
  run:
