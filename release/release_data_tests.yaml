- name: DEFAULTS
  group: data-base
  working_dir: nightly_tests/dataset

  frequency: nightly
  team: data

  cluster:
    byod:
      runtime_env:
        # Enable verbose stats for resource manager (to troubleshoot autoscaling)
        - RAY_DATA_DEBUG_RESOURCE_MANAGER=1
        # Fail the test if a worker OOMs
        - RAYTEST_FAIL_ON_WORKER_OOM=1
        # Fail the test if a node dies
        - RAYTEST_FAIL_ON_DEAD_NODES=1
        # Fail the test if a worker spills
        - RAYTEST_FAIL_ON_SPILLING=1

      # 'type: gpu' means: use the 'ray-ml' image.
      type: gpu
    cluster_compute: fixed_size_cpu_compute.yaml

###############
# Reading tests
###############

- name: "read_parquet_{{scaling}}"
  python: "3.10"
  cluster:
    anyscale_sdk_2026: true
    cluster_compute: "{{scaling}}_cpu_compute.yaml"

  matrix:
    setup:
      scaling: [fixed_size, autoscaling]

  run:
    timeout: 3600
    script: >
      python read_and_consume_benchmark.py
      s3://ray-benchmark-data-internal-us-west-2/imagenet/parquet --format parquet
      --iter-bundles

# NOTE: the two scaling variants are spelled out rather than driven by a matrix
# because they want opposite bin budgets, and a matrix would take the cartesian
# product. Files here are ~3.9 GiB uncompressed with ~69 MiB row groups, so the
# default budget can't fit two row groups and every one becomes its own read
# task (~5.8k tasks for 103 files). On a fixed cluster that task explosion
# dominates and a larger budget wins; on an autoscaling cluster the extra tasks
# give the autoscaler demand to act on earlier and the default wins.
- name: "read_large_parquet_fixed_size"
  python: "3.10"
  cluster:
    anyscale_sdk_2026: true
    byod:
      runtime_env:
        # 1 GiB packs ~14 row groups per bin, cutting the task count ~14x.
        - RAY_DATA_PARQUET_BIN_PACKING_BYTES=1073741824
    cluster_compute: "fixed_size_cpu_compute.yaml"

  run:
    timeout: 3600
    # Ray Data can't guarantee memory safety if you haven't hinted how much heap memory
    # high-memory operations require. Since reading large Parquet files requires lots of
    # heap memory, we need to manually specify the memory to prevent OOMs.
    #
    # 3650722201 is ~3.4 GiB, the maximum heap memory observed in our tests.
    script: >
      python read_and_consume_benchmark.py
      s3://ray-benchmark-data-internal-us-west-2/large-parquet/ --format parquet
      --iter-bundles --memory 3650722201

- name: "read_large_parquet_autoscaling"
  python: "3.10"
  cluster:
    anyscale_sdk_2026: true
    # Default budget: -25% vs master here, against +2% at 4 GiB.
    cluster_compute: "autoscaling_cpu_compute.yaml"

  run:
    timeout: 3600
    # See the fixed_size variant for why --memory is pinned.
    script: >
      python read_and_consume_benchmark.py
      s3://ray-benchmark-data-internal-us-west-2/large-parquet/ --format parquet
      --iter-bundles --memory 3650722201

