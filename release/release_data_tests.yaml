# Mimics production ML inference pipeline with:
# - Separate preprocessing (CPU) and inference (GPU actors) stages
# - Pandas preprocessing
# - Metadata column passthrough
# - Extra output columns
- name: multi_stage_batch_inference
  python: "3.10"
  frequency: weekly
  group: data-batch-inference
  env: gce

  cluster:
    anyscale_sdk_2026: true
    cluster_compute: autoscaling_gpu_g2_gce.yaml

  run:
    timeout: 3600
    script: >
      python model_inference_pipeline_benchmark.py
      --input-path s3://ray-benchmark-data/tpch/parquet/sf100/lineitem
      --preprocessing-batch-size "auto"
      --inference-batch-size 1024
      --inference-min-actors 1
      --inference-max-actors 300

##############
# TPCH Queries
##############

- name: "tpch_q1_{{scaling}}_{{shuffle_strategy}}"
  python: "3.10"
  matrix:
    setup:
      scaling: [fixed_size, autoscaling]
      shuffle_strategy: [hash_shuffle, hash_shuffle_v2]

  cluster:
    anyscale_sdk_2026: true
    byod:
      runtime_env:
        # sf1000 lineitem: 1000 files x 49 row groups, 24.36 MiB uncompressed
        # per row group at the full 17-column schema. q1 projects 7 of those
        # columns and pre-filters on l_shipdate, so the packer sizes on a
        # fraction of that -- which is why this lands well below the 1 GiB the
        # full-schema readers of the same table (map_batches, write_parquet)
        # want. 192 MiB measured best here, matching q20 on the same table.
        - RAY_DATA_PARQUET_BIN_PACKING_BYTES=201326592
    cluster_compute: "{{scaling}}_all_to_all_compute.yaml"

  run:
    timeout: 5400
    script: RAY_DATA_DEFAULT_SHUFFLE_STRATEGY={{shuffle_strategy}} python tpch/tpch_q1.py --sf 1000

