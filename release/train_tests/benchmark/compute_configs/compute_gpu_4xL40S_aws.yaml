cloud: {{env["ANYSCALE_CLOUD_NAME"]}}

head_node:
    instance_type: m5.4xlarge

# 4x L40S-48GB on a single g6e.12xlarge. Restores multi-GPU (data-parallel +
# ZeRO all-reduce) coverage while being a smaller, more schedulable shape than
# the 8-GPU g5.48xlarge. L40S is bf16-native (Ada) with 2x the memory of A10G.
worker_nodes:
    - instance_type: g6e.12xlarge
      min_nodes: 1
      max_nodes: 1
      market_type: ON_DEMAND
