# Fake-GPU small cluster for the lineage reconstruction chaos test. The workers are
# CPU nodes carrying a logical GPU:1 resource, so the embedding actors schedule here
# and emulate the T4 forward pass with a sleep (see main.py --fake-gpu). m5.2xlarge
# matches g4dn.2xlarge's 8 vCPU and 32 GiB, without its GPU.
cloud: {{env["ANYSCALE_CLOUD_NAME"]}}

enable_cross_zone_scaling: true

advanced_instance_config:
    IamInstanceProfile: {"Name": "ray-autoscaler-v1"}

head_node:
    instance_type: m5.2xlarge

worker_nodes:
    - instance_type: m5.2xlarge
      min_nodes: 20
      max_nodes: 20
      market_type: ON_DEMAND
      resources:
        CPU: 8
        GPU: 1
