applications:
  - args:
      prefill_config:
        model_loading_config:
          model_id: RedHatAI/Qwen3.5-9B-quantized.w4a16
        accelerator_type: H100
        engine_kwargs:
          max_model_len: 8192
          language_model_only: true
          # Qwen3.5 thinks by default; disable so probes get direct answers.
          default_chat_template_kwargs:
            enable_thinking: false
          tensor_parallel_size: 1
          enforce_eager: true
          kv_transfer_config:
            kv_connector: NixlConnector
            kv_role: kv_both
        runtime_env:
          env_vars:
            VLLM_SSM_CONV_STATE_LAYOUT: DS
        deployment_config:
          autoscaling_config:
            min_replicas: 2
            max_replicas: 2
      decode_config:
        model_loading_config:
          model_id: RedHatAI/Qwen3.5-9B-quantized.w4a16
        accelerator_type: H100
        engine_kwargs:
          max_model_len: 8192
          language_model_only: true
          # Qwen3.5 thinks by default; disable so probes get direct answers.
          default_chat_template_kwargs:
            enable_thinking: false
          tensor_parallel_size: 1
          enforce_eager: true
          kv_transfer_config:
            kv_connector: NixlConnector
            kv_role: kv_both
        runtime_env:
          env_vars:
            VLLM_SSM_CONV_STATE_LAYOUT: DS
        deployment_config:
          autoscaling_config:
            min_replicas: 6
            max_replicas: 6
    import_path: ray.serve.llm:build_pd_openai_app
    name: llm-endpoint
    route_prefix: /
