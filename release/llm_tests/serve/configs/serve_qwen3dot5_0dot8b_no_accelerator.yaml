applications:
  - args:
      llm_configs:
        - model_loading_config:
            model_id: Qwen/Qwen3.5-0.8B
          engine_kwargs:
            language_model_only: true
            default_chat_template_kwargs:
              enable_thinking: false
            max_model_len: 8192
            enforce_eager: true
    import_path: ray.serve.llm:build_openai_app
    name: llm-endpoint
    route_prefix: /
