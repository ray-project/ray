# KV-aware P/D with LoRA adapters: two prefill and two decode replicas, routed
# by a router application. Requires RAY_SERVE_ENABLE_HA_PROXY=1 and
# RAY_SERVE_LLM_ENABLE_DIRECT_STREAMING=1.
applications:
  - name: pd-backend
    route_prefix: /pd-backend
    import_path: ray.serve.llm:build_pd_openai_app
    args: &pd_args
      prefill_config: &llm_config
        model_loading_config:
          model_id: llama-216m-dummy
          model_source: s3://anonymous@air-example-data/llama-3.2-216M-dummy/
        lora_config:
          dynamic_lora_loading_path: s3://anonymous@air-example-data/llama-3.2-216M-lora-dummy-multi
        deployment_config:
          num_replicas: 2
          request_router_config:
            request_router_class: ray.serve.llm.request_router.KVAwareRouter
        engine_kwargs:
          max_model_len: 2048
          enable_lora: true
          max_lora_rank: 16
          max_loras: 2
          enable_prompt_tokens_details: true
          kv_transfer_config:
            kv_connector: NixlConnector
            kv_role: kv_both
      decode_config: *llm_config
  - name: pd-router
    route_prefix: /
    import_path: ray.llm._internal.serve.serving_patterns.prefill_decode.builder:build_pd_router_app
    args: *pd_args
