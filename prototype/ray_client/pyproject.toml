[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ray-client"
version = "0.1.0"
description = "Lightweight, zero-ray-dependency HTTP client for running functions as drivers on a Ray cluster."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"  # ast.unparse (client side); the cluster runner uses Ray's interpreter
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
