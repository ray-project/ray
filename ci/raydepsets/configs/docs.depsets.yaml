build_arg_sets:
  py310:
    PYTHON_VERSION: "3.10"
    PYTHON_SHORT: "310"
  py311:
    PYTHON_VERSION: "3.11"
    PYTHON_SHORT: "311"


depsets:
  - name: docbuild_depset_${PYTHON_SHORT}
    operation: compile
    depsets:
      - ray_img_depset_${PYTHON_SHORT}
    requirements:
      - doc/requirements-doc.txt
    # Pin pyarrow to the version Ray Data tests against instead of hand-maintaining
    # a separate pin in requirements-doc.txt. pyarrow is in the docs build only
    # because rendered Ray Data docstrings import it, so it should track Ray Data's
    # tested version. This file also pins pandas, modin, and others; they're inert
    # here today because the docs build doesn't resolve them, but if it ever pulls
    # one in, it would be constrained to Ray Data's tested version too. That's the
    # same intent, but keep it in mind before adding a heavy Ray Data package to the
    # docs build, and prefer a pyarrow-only constraint file if the coupling grows.
    constraints:
      - python/requirements/data/pyarrow-latest.txt
    output: python/deplocks/docs/docbuild_depset_py${PYTHON_VERSION}.lock
    append_flags:
      - --python-version=${PYTHON_VERSION}
      - --python-platform=linux
      - --unsafe-package ray
    build_arg_sets:
      - py311
    include_setuptools: true

  - name: doctest_depset_${PYTHON_SHORT}
    operation: expand
    depsets:
      - ray_img_depset_${PYTHON_SHORT}
    requirements:
      - python/requirements/doc/doc-test-requirements.txt
      - python/requirements/test-requirements.txt
      - python/requirements/ml/train-requirements.txt
      - python/requirements/ml/train-test-requirements.txt
      - python/requirements/ml/tune-requirements.txt
      - python/requirements/ml/tune-test-requirements.txt
      - python/requirements/ml/data-requirements.txt
      - python/requirements/ml/core-requirements.txt
      - python/requirements/ml/rllib-requirements.txt
      - python/requirements/ml/rllib-test-requirements.txt
      - python/requirements/ml/dl-cpu-requirements.txt
    constraints:
      - /tmp/ray-deps/requirements_compiled_py3.13.txt
    output: python/deplocks/docs/doctest_depset_py${PYTHON_VERSION}.lock
    append_flags:
      - --index https://download.pytorch.org/whl/cpu
      - --python-version=${PYTHON_VERSION}
      - --python-platform=linux
      - --unsafe-package ray
    build_arg_sets:
      - py310
    pre_hooks:
      - ci/raydepsets/pre_hooks/remove-compiled-headers.sh 3.13

  # The "docstring-only" label's examples environment: ray[all] plus what the
  # modules holding >>> examples import, without torch or TensorFlow, so the
  # image stays small to pull. Examples that need torch or TensorFlow are
  # skipped there and run in each library's doctest() target instead: in
  # premerge for libraries whose suites the label doesn't skip, and postmerge
  # for Ray Data. Same
  # constraints as doctest_depset, so shared packages resolve to the same
  # versions.
  - name: docstring_examples_base_depset_${PYTHON_SHORT}
    operation: expand
    depsets:
      - ray_img_depset_${PYTHON_SHORT}
    requirements:
      - python/requirements/doc/docstring-examples-requirements.txt
    constraints:
      - /tmp/ray-deps/requirements_compiled_py3.13.txt
    output: python/deplocks/docs/docstring_examples_base_depset_py${PYTHON_VERSION}.lock
    append_flags:
      - --python-version=${PYTHON_VERSION}
      - --python-platform=linux
      - --unsafe-package ray
    build_arg_sets:
      - py310
    pre_hooks:
      - ci/raydepsets/pre_hooks/remove-compiled-headers.sh 3.13

  # Drop cupy-cuda12x, the CUDA build ray[cgraph] pins, and fastrlock, which
  # only cupy requires: about 225 MB the CPU-only examples don't use.
  - name: docstring_examples_depset_${PYTHON_SHORT}
    operation: relax
    source_depset: docstring_examples_base_depset_${PYTHON_SHORT}
    packages:
      - cupy-cuda12x
      - fastrlock
    output: python/deplocks/docs/docstring_examples_depset_py${PYTHON_VERSION}.lock
    build_arg_sets:
      - py310
