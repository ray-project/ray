name: "llmbuild-aarch64"
froms: ["cr.ray.io/rayproject/oss-ci-base_build-aarch64-py$PYTHON"]
dockerfile: ci/docker/llm.build.Dockerfile
srcs:
  - ci/env/install-dependencies.sh
  - ci/env/install-llvm-binaries.sh
  - ci/suppress_output
  - python/deplocks/llm/rayllm_test_py312_cpu.lock
  - python/deplocks/llm/rayllm_test_py312_cu130.lock
  - python/requirements/llm/patches/vllm-device-aware-compile-cache.patch
tags:
  - cr.ray.io/rayproject/llmbuild-aarch64
build_args:
  - DOCKER_IMAGE_BASE_BUILD=cr.ray.io/rayproject/oss-ci-base_build-aarch64-py$PYTHON
  - RAY_CUDA_CODE=$RAY_CUDA_CODE
