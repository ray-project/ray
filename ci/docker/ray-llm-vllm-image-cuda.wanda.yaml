name: "ray-llm-vllm-py$PYTHON_VERSION-cu$CUDA_VERSION$ARCH_SUFFIX"
disable_caching: true
froms:
  - "cr.ray.io/rayproject/ray-llm-vllm-py$PYTHON_VERSION-cu$CUDA_VERSION-base$ARCH_SUFFIX"  # ray-llm-vllm base image
  - "cr.ray.io/rayproject/ray-wheel-py$PYTHON_VERSION$ARCH_SUFFIX"                          # Ray wheel
dockerfile: ci/docker/ray-llm-vllm-image.Dockerfile
build_args:
  - BASE_IMAGE=cr.ray.io/rayproject/ray-llm-vllm-py$PYTHON_VERSION-cu$CUDA_VERSION-base$ARCH_SUFFIX
  - RAY_WHEEL_IMAGE=cr.ray.io/rayproject/ray-wheel-py$PYTHON_VERSION$ARCH_SUFFIX
  - RAY_COMMIT=$BUILDKITE_COMMIT
  - RAY_VERSION
