extends: existence
message: "Describe what the reader does, not what the product permits ('%s')."
link: 'https://docs.ray.io/en/latest/ray-contribute/writing-style.html#focus-on-what-the-reader-does'
level: warning
ignorecase: true
nonword: false
# From the "Focus on what the reader does" section of writing-style.md. Flags the
# "allows/enables/lets you" construction so the sentence gets recast around the reader.
tokens:
  - '(?:allows?|enables?|lets?) (?:you|the user|users)'
