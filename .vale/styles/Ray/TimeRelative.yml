extends: existence
message: "Avoid the time-relative word '%s'; it goes stale. Remove it or name a specific version."
link: 'https://docs.ray.io/en/latest/ray-contribute/writing-style.html#avoid-time-relative-words'
level: warning
ignorecase: true
# From the "Avoid time-relative words" section of writing-style.md. "now" and "new"
# are deliberately omitted: both have too many legitimate non-temporal uses to flag
# without heavy false positives.
tokens:
  - currently
  - recently
  - at this time
  - in the future
  - for now
