extends: substitution
message: "Use '%s' instead of '%s'."
link: 'https://docs.ray.io/en/latest/ray-contribute/writing-style.html#word-choice'
level: warning
ignorecase: true
# Library-agnostic plain-word swaps from the "Prefer plain words" and "Streamline
# references" sections of writing-style.md. This package is shared across all Ray
# libraries; per-library terminology lives in that library's own style directory.
#
# `vocab: false` so an accept-list entry can't silently shadow a swap. See the note
# in .vale/styles/KubeRay/Terms.yml for why that shadowing is easy to miss.
vocab: false
swap:
  utilize: use
  utilizes: use
  utilized: use
  utilizing: using
  leverage: use
  leverages: use
  leveraged: use
  leveraging: using
  via: through
  prior to: before
  in order to: to
  due to the fact that: because
  refer to: see
