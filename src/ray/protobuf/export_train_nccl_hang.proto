syntax = "proto3";

option cc_enable_arenas = true;

package ray.rpc;

// This message defines the event_data stored by the export API for
// EXPORT_TRAIN_NCCL_HANG type events, emitted by the Ray Train NCCL hang
// detector. This schema is public and any changes must be backward compatible.
//
// Each event is a snapshot of the communicators the detector considers hung
// (suspected or confirmed), so the newest event of an attempt (by
// `poll_index`) is the detector's current state for that attempt. Nothing is
// emitted for an attempt that never stalls. Events are emitted:
//   - MONITORING on each poll that newly suspects or confirms a communicator,
//     on the periodic "still suspected" warning, and on each poll where a
//     communicator recovers (an empty `communicators` once the last one has).
//   - STOPPED when the attempt's worker group shuts down (it crashed, was
//     retried, finished or was stopped) with a communicator still hung. A
//     later attempt of the run starts with no hung communicators, and its
//     `poll_index` restarts.
//   - DISABLED when the detector gives up for the rest of the run. No further
//     events are emitted for the run, for this or any later attempt.
//
// Compatibility, for writers and readers of this event:
//   - Fields and enum values are only ever added, never renumbered, renamed or
//     repurposed. A removed field's number is reserved.
//   - Readers ignore fields they don't know, and treat an enum value they
//     don't know as the safe default: a communicator state they don't know is
//     not hung, and a detector status they don't know is not watching.
//   - `schema_version` changes only for a change readers can't ignore, e.g. a
//     field changing meaning. Readers skip versions they don't support.
//
// Kept out of export_train_state.proto so that the Train run schema version
// is unaffected by changes to this event.
message ExportTrainNcclHangEventData {
  enum DetectorStatus {
    DETECTOR_STATUS_UNSPECIFIED = 0;
    // Monitoring the attempt. Whether a hang is suspected or confirmed is
    // given by `communicators`, not by this status.
    MONITORING = 1;
    // Stopped monitoring the attempt, as its worker group shut down while a
    // communicator was hung.
    STOPPED = 2;
    // Disabled for the rest of the run.
    DISABLED = 3;
  }

  enum DisabledReason {
    DISABLED_REASON_UNSPECIFIED = 0;
    // `ncclras` can't be used, e.g. the binary is missing or rejects the
    // query, which a change to the cluster's setup can fix.
    RAS_UNAVAILABLE = 1;
    // The detector hit an unexpected error.
    INTERNAL_ERROR = 2;
  }

  // A hung communicator.
  message Communicator {
    enum State {
      STATE_UNSPECIFIED = 0;
      // Stalled past the suspicion threshold.
      SUSPECTED = 1;
      // Stalled for the confirm duration. It stays confirmed until it
      // recovers.
      CONFIRMED = 2;
    }

    // The NCCL RAS communicator hash.
    string communicator_id = 1;
    State state = 2;
    // When the stall began: the poll before the first frozen poll, in
    // milliseconds since the UNIX epoch.
    int64 stalled_since_ms = 3;
  }

  // Version of the message schema, starting at 1.
  uint32 schema_version = 1;
  // The Ray Train run id (the `id` of ExportTrainRunEventData).
  string run_id = 2;
  // The run attempt id (the `attempt_id` of ExportTrainRunAttemptEventData).
  string attempt_id = 3;
  // Orders the events of an attempt, strictly increasing. It restarts with
  // each attempt, so it only orders events with the same `attempt_id`.
  int64 poll_index = 4;
  // When the poll was taken (when the detector stopped, for STOPPED and
  // DISABLED), in milliseconds since the UNIX epoch.
  int64 timestamp_ms = 5;
  DetectorStatus detector_status = 6;
  // Why the detector was disabled. Set for DISABLED only.
  optional DisabledReason disabled_reason = 7;
  // The `ncclras -f text` report, on the first poll of a suspected hang and
  // on its confirmation. Capped at 32 KB, keeping the head.
  optional string ras_text_report = 8;
  // Where the diagnostics were uploaded (`<experiment_fs_path>/hang_detector`),
  // on the poll that confirmed a communicator.
  optional string diagnostics_dir = 9;
  // The hung communicators at this poll, ordered by `communicator_id`; empty
  // on the poll where the last one recovers. For STOPPED and DISABLED, those
  // still hung at the stop.
  repeated Communicator communicators = 10;
}
