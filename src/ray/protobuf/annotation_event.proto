syntax = "proto3";

package ray.rpc;

// AnnotationEvent is a point-in-time event that a dashboard renders on the same
// timeline as its metric panels, such as a Train controller state change or a
// `ray.train.report` call.
//
// Each process serializes the event as one JSON object per line to
// `<session_dir>/logs/annotations_<pid>.log`. A log collector tails those files
// and forwards the lines to a log backend, which Grafana queries as an
// annotation datasource. The JSON field names are therefore a contract with the
// generated dashboard queries: rename a field and the queries stop matching.
//
// The event is not part of the export API (`ExportEvent`), which is being
// superseded by `RayEvent` (`src/ray/protobuf/public/events_base_event.proto`).
// Annotations go to a file because `RayEvent` delivery is not enabled by
// default. If they later move to `RayEvent`, `timestamp_s`, `session_name`,
// `message` and `severity` map onto the `RayEvent` base fields and the rest
// becomes the nested event.
message AnnotationEvent {
  // How important the event is. Dashboards color annotations by severity, so a
  // producer that has no notion of severity leaves it unspecified rather than
  // picking one. The values mirror the Python logging levels.
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    DEBUG = 1;
    INFO = 2;
    WARNING = 3;
    ERROR = 4;
    CRITICAL = 5;
  }

  // The Ray component that emitted the annotation, such as
  // "ray_train_annotation". Dashboard queries select their own annotations with
  // it, so that one dashboard does not render another component's events.
  string annotation_source = 1;
  // Machine-readable name of the event, such as "controller_state_change". A
  // dashboard renders one annotation layer per event name.
  string event = 2;
  // Seconds since the Unix epoch when the event was emitted. A collector can use
  // it as the log entry's timestamp, which is what a dashboard positions the
  // annotation by.
  double timestamp_s = 3;
  // The Ray session that emitted the event. Dashboard queries pin it so that a
  // log backend aggregating several clusters cannot render one cluster's
  // annotations on another cluster's dashboard.
  string session_name = 4;
  // Human-readable description of the event, which a dashboard shows as the
  // annotation text.
  string message = 5;
  // Severity of the event.
  Severity severity = 6;
  // Identity of the emitter, attached to every event it emits, such as the Ray
  // Train run name, run ID and world rank. Dashboard queries filter on these to
  // scope annotations to one run or one worker.
  map<string, string> tags = 7;
  // Payload specific to this event, such as the reported metrics of a
  // `ray.train.report` call. Values are stringified, because a log backend
  // represents them as string labels.
  map<string, string> fields = 8;
}
