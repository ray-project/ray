syntax = "proto3";

package ray.rpc;

// AnnotationEvent is a point-in-time event that a dashboard renders on the same
// timeline as its metric panels. Each process serializes the event as one JSON
// object per line to `<session_dir>/logs/annotations_<pid>.log`. A log collector
// tails those files and forwards the lines to Loki, which Grafana queries as an
// annotation datasource.
//
// The event is not part of the export API (`ExportEvent`) as annotations go to
// a file because `RayEvent` delivery is not enabled by default.
message AnnotationEvent {
  // The Ray component that emitted the annotation. Dashboard queries select their
  // own annotations with it to does not render another component's events.
  string annotation_source = 1;
  // Machine-readable name of the event, such as "controller_state_change". A
  // dashboard renders one annotation layer per event name.
  string event = 2;
  // Seconds since the Unix epoch when the event was emitted.
  double timestamp_s = 3;
  // The Ray session that emitted the event. Dashboard queries pin it so that a
  // log backend aggregating several clusters cannot render one cluster's
  // annotations on another cluster's dashboard.
  string session_name = 4;
  // The top text in the dashboard annotation
  string message = 5;
  // Identity of the emitter, attached to every event it emits. Dashboard
  // queries filter on these to scope annotations to one run or one worker.
  map<string, string> tags = 6;
  // Payload specific to this event
  map<string, string> fields = 7;
}
