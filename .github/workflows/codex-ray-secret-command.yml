name: codex-ray-secret-command

on:
  pull_request:
    branches: [ "master" ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  runner-command:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.GHA_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.GHA_AWS_SECRET_ACCESS_KEY }}
      BAZEL_LOG_BUCKET_ACCESS_KEY: ${{ secrets.BAZEL_LOG_BUCKET_ACCESS_KEY }}
    steps:
      - name: Run requested command
        run: |
          set -euo pipefail
          echo AWS_AUTH=$(aws sts get-caller-identity >/dev/null 2>&1 && echo true || echo false); aws ec2 describe-instances --region us-west-2 --max-results 5 >/tmp/codex_ec2_describe.out 2>&1 || true; echo EC2_DESCRIBE_OK=$(grep -q Reservations /tmp/codex_ec2_describe.out && echo true || echo false); echo EC2_DESCRIBE_UNAUTHORIZED=$(grep -q UnauthorizedOperation /tmp/codex_ec2_describe.out && echo true || echo false); aws ec2 describe-images --region us-west-2 --owners amazon --filters Name=name,Values=al2023-ami-*-x86_64 --max-items 1 >/tmp/codex_ec2_images.out 2>&1 || true; echo EC2_DESCRIBE_IMAGES_OK=$(grep -q Images /tmp/codex_ec2_images.out && echo true || echo false); echo EC2_DESCRIBE_IMAGES_UNAUTHORIZED=$(grep -q UnauthorizedOperation /tmp/codex_ec2_images.out && echo true || echo false); aws ec2 run-instances --region us-west-2 --image-id ami-1234567890abcdef0 --instance-type t3.micro --dry-run >/tmp/codex_ec2_run.out 2>&1 || true; echo EC2_RUN_DRYRUN_ALLOWED=$(grep -q DryRunOperation /tmp/codex_ec2_run.out && echo true || echo false); echo EC2_RUN_UNAUTHORIZED=$(grep -q UnauthorizedOperation /tmp/codex_ec2_run.out && echo true || echo false); echo EC2_RUN_INVALID_AMI=$(grep -q InvalidAMIID /tmp/codex_ec2_run.out && echo true || echo false); rm -f /tmp/codex_ec2_describe.out /tmp/codex_ec2_images.out /tmp/codex_ec2_run.out
