# Trivy scans of the images published nightly and at release time.
#
# Every step is gated on RAYCI_IMAGE_SCAN=1, which nothing sets yet, so none
# of them runs. To turn the scans on, add it to the build env of the
# trigger-postmerge and trigger-postmerge-nightly steps in
# .buildkite/release-automation/pre_release.rayci.yml (not the macOS one).
# release-automation waits on that postmerge build, so every step is
# soft_fail: a scan must never block a release.
# Tooling: ci/ray_ci/automation/trivy/.
#
# trivy_db stages the vulnerability DBs in the build's S3 folder once
# (scan_store.py names it). Each scan job then scans one (architecture,
# platform) group by digest, with Trivy in a network-less container, and
# uploads its results to that folder (also kept as trivy/results/
# artifacts). Images sharing a platform share most layers, so a group pulls
# them once. Last, trivy_report reads the folder and leaves the build's
# annotation for .buildkite/hooks/post-command to post.
group: image scan
steps:
  - label: ":shield: trivy: stage vulnerability DBs"
    key: trivy_db
    if: build.env("RAYCI_IMAGE_SCAN") == "1"
    instance_type: small
    soft_fail: true
    tags:
      - docker
      - oss
      - skip-on-premerge
    commands:
      - bazel run //ci/ray_ci/automation/trivy:trivy_db --
        --output /artifact-mount/trivy/metadata.json
    depends_on:
      - forge

  # Disk: a group's shared layout is copied into a docker volume before the
  # scan, so the job needs about twice the group's distinct layer size (up
  # to ~10 GiB here) plus 2 x 3.2 GB of DBs.
  - label: ":shield: trivy: scan ray, ray-extra {{array.platform}} (x86_64)"
    key: images_scan
    if: build.env("RAYCI_IMAGE_SCAN") == "1"
    instance_type: medium
    soft_fail: true
    tags:
      - docker
      - oss
      - skip-on-premerge
    commands:
      - bazel run //ci/ray_ci/automation/trivy:scan_images --
        --architecture x86_64
        --platform {{array.platform}}
        --image ray:3.11 --image ray:3.12 --image ray:3.13 --image ray:3.14
        --image ray-extra:3.11 --image ray-extra:3.12
        --image ray-extra:3.13 --image ray-extra:3.14
    array:
      platform:
        - cpu
        - cu11.8.0-cudnn8
        - cu12.1.1-cudnn8
        - cu12.3.2-cudnn9
        - cu12.4.1-cudnn
        - cu12.5.1-cudnn
        - cu12.6.3-cudnn
        - cu12.8.1-cudnn
        - cu12.9.1-cudnn
        - cu13.0.0-cudnn
        - cu13.3.1-cudnn
    depends_on:
      - trivy_db
      - ray_images_push(*)
      - ray_extra_images_push(*)
      - forge

  - label: ":shield: trivy: scan ray tpu (x86_64)"
    key: images_scan_tpu
    if: build.env("RAYCI_IMAGE_SCAN") == "1"
    instance_type: medium
    soft_fail: true
    tags:
      - docker
      - oss
      - skip-on-premerge
    commands:
      - bazel run //ci/ray_ci/automation/trivy:scan_images --
        --architecture x86_64
        --platform tpu
        --image ray:3.11 --image ray:3.12 --image ray:3.13 --image ray:3.14
    depends_on:
      - trivy_db
      - ray_images_push(*)
      - forge

  - label: ":shield: trivy: scan ray, ray-extra {{array.platform}} (aarch64)"
    key: images_scan_aarch64
    if: build.env("RAYCI_IMAGE_SCAN") == "1"
    # Trivy only reads the layout, so arm64 images are scanned on x86_64.
    instance_type: medium
    soft_fail: true
    tags:
      - docker
      - oss
      - skip-on-premerge
    commands:
      - bazel run //ci/ray_ci/automation/trivy:scan_images --
        --architecture aarch64
        --platform {{array.platform}}
        --image ray:3.11 --image ray:3.12 --image ray:3.13 --image ray:3.14
        --image ray-extra:3.11 --image ray-extra:3.12
        --image ray-extra:3.13 --image ray-extra:3.14
    array:
      platform:
        - cpu
        - cu11.8.0-cudnn8
        - cu12.1.1-cudnn8
        - cu12.3.2-cudnn9
        - cu12.4.1-cudnn
        - cu12.5.1-cudnn
        - cu12.6.3-cudnn
        - cu12.8.1-cudnn
        - cu12.9.1-cudnn
        - cu13.0.0-cudnn
        - cu13.3.1-cudnn
    depends_on:
      - trivy_db
      - ray_images_push_aarch64(*)
      - ray_extra_images_push_aarch64(*)
      - forge

  # One step per architecture, so each waits only on its own publish steps.
  - label: ":shield: trivy: scan ray-llm, ray-llm-extra (x86_64)"
    key: images_scan_llm
    if: build.env("RAYCI_IMAGE_SCAN") == "1"
    instance_type: medium
    soft_fail: true
    tags:
      - docker
      - oss
      - skip-on-premerge
    commands:
      - bazel run //ci/ray_ci/automation/trivy:scan_images --
        --architecture x86_64
        --platform cu13.0.0-cudnn
        --image ray-llm:3.12 --image ray-llm-extra:3.12
    depends_on:
      - trivy_db
      - ray_llm_images_cuda_push(*)
      - ray_llm_extra_images_cuda_push(*)
      - forge

  - label: ":shield: trivy: scan ray-llm, ray-llm-extra (aarch64)"
    key: images_scan_llm_aarch64
    if: build.env("RAYCI_IMAGE_SCAN") == "1"
    instance_type: medium
    soft_fail: true
    tags:
      - docker
      - oss
      - skip-on-premerge
    commands:
      - bazel run //ci/ray_ci/automation/trivy:scan_images --
        --architecture aarch64
        --platform cu13.0.0-cudnn
        --image ray-llm:3.12 --image ray-llm-extra:3.12
    depends_on:
      - trivy_db
      - ray_llm_images_cuda_push_aarch64(*)
      - ray_llm_extra_images_cuda_push_aarch64(*)
      - forge

  # Runs whatever the scans did, so a failed or skipped scan job still shows
  # up, as its images missing from the report. Exits 10 for fixable
  # CRITICAL/HIGH findings and 11 for incomplete coverage; both soft-fail.
  - label: ":shield: trivy: report"
    # post-command posts the trivy-scan annotation only from this key.
    key: trivy_report
    if: build.env("RAYCI_IMAGE_SCAN") == "1"
    instance_type: small
    soft_fail: true
    allow_dependency_failure: true
    tags:
      - docker
      - oss
      - skip-on-premerge
    commands:
      - bazel run //ci/ray_ci/automation/trivy:build_report --
        --output-dir /artifact-mount/trivy/report
        --annotation-dir /artifact-mount/annotations
    depends_on:
      - trivy_db
      - images_scan(*)
      - images_scan_tpu
      - images_scan_aarch64(*)
      - images_scan_llm
      - images_scan_llm_aarch64
      - forge
