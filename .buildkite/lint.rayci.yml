group: lint
# The lint matrix is split by tag so a pull request only runs the checks that
# can apply to it. See the prose rule in always.rules.txt for the mechanism:
# `always` is emitted for every changed file, `lint` only for files that are
# not prose, and narrower tags only for the paths that feed one specific check.
steps:
  # Lint checks a Markdown or reStructuredText change can actually fail. These
  # keep `always`, so they run on every pull request. Adding a step here
  # asserts that a prose-only diff can fail it; if it can't, give the step a
  # tag matching its real inputs instead, as `doc_readme` does below.
  #
  # The pre-commit whitespace and end-of-file hooks are deliberately not here.
  # `.pre-commit-config.yaml` excludes `doc/source/` globally, so those hooks
  # cannot see the prose a documentation change actually touches; a step
  # running them would be theater. Removing that exclude is worth doing, but
  # it is a separate change with a large mechanical diff.
  - label: ":lint-roller: lint: {{matrix}}"
    key: lint-small-prose
    tags:
      - lint
      - always
    depends_on:
      - forge
    commands:
      - ./ci/lint/lint.sh {{matrix}}
    matrix:
      - documentation_style
      - doc_no_new_rst

  # `doc_readme` runs `setup.py check --restructuredtext --strict --metadata`,
  # which guards how Ray's PyPI long description renders. Its inputs are the
  # repo-root README.rst and python/setup.py; nothing under doc/ feeds it, so a
  # prose change cannot change its result. The name reads like documentation,
  # which is how it ended up in the prose matrix above, but it belongs to
  # packaging.
  #
  # It carries `pypi_readme` alone so the rule in always.rules.txt naming those
  # two files is its only trigger. Prose pull requests and code pull requests
  # that leave both files alone both stop selecting it. One consequence of
  # dropping `lint`: the microcheck pipeline's hardcoded `tag:lint` selector no
  # longer makes the step eligible there, so it runs on premerge only.
  # Microcheck is non-blocking, and premerge is the gate this check has to hold.
  - label: ":lint-roller: lint: doc_readme"
    key: lint-pypi-readme
    tags:
      - pypi_readme
    depends_on:
      - forge
    commands:
      - ./ci/lint/lint.sh doc_readme

  # Code-oriented lint checks. These carry `lint` without `always`, so they are
  # filtered out when every changed file is documentation prose. Selects and
  # rule-emitted tags are ANDed in rayci's step filter, so the microcheck
  # pipeline's hardcoded `tag:lint` selector does not resurrect them: it only
  # makes them eligible, and the rules still have to emit `lint`.
  - label: ":lint-roller: lint: {{matrix}}"
    key: lint-small
    tags:
      - lint
    depends_on:
      - forge
    commands:
      - ./ci/lint/lint.sh {{matrix}}
    matrix:
      - clang_format
      - pre_commit
      - semgrep_lint
      - dashboard_format
      - copyright_format
      - bazel_team
      - bazel_buildifier
      - pytest_format
      - test_coverage

  - label: ":lint-roller: pre-commit pydoclint"
    key: pydoclint-small
    tags:
      - oss
      - lint
    depends_on:
      - forge
    commands:
      - ./ci/lint/lint.sh pre_commit_pydoclint

  # Diff-scoped @PublicAPI parameter-coverage check: fails when a PR adds a new
  # public API, or a new parameter on an existing one, without a docstring
  # Args: entry. Pre-existing gaps are grandfathered. Static (no docbuild), so
  # it runs in the lint group. `soft_fail: true` keeps it visible but
  # non-blocking during the warn phase; remove `soft_fail` to make it a
  # required check once the false-positive rate is confirmed low.
  - label: ":lint-roller: lint: API param coverage"
    key: api-param-coverage
    tags:
      - oss
      - lint
      - always
    depends_on:
      - forge
    soft_fail: true
    commands:
      - ./ci/lint/lint.sh api_param_coverage --blocking

  # Scope guard for the "docs-go" label: runs only when the label is present,
  # and fails unless the PR is content-only (changes under doc/, excluding
  # BUILD files). This is the check the label cannot turn off, so the label
  # can skip doc/library tests on a content PR but never on a code, CI, or
  # build change.
  - label: ":lint-roller: lint: validate docs-go scope"
    key: docs-go-scope
    if: build.pull_request.labels includes "docs-go"
    tags:
      - oss
      - always
    depends_on:
      - forge
    commands:
      - ./ci/lint/validate_docs_go_scope.sh
