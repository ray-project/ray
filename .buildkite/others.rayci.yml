group: others
depends_on:
  - forge
steps:
  # docs
  - name: doctestbuild
    wanda: ci/docker/doctest.build.wanda.yaml
    depends_on: oss-ci-base_build-multipy(python=3.10)
    env:
      PYTHON: "3.10"
    tags: cibase

  # The "docstring-only" label's examples environment, without torch or
  # TensorFlow. See ci/docker/docstring.build.Dockerfile.
  - name: docstringbuild
    wanda: ci/docker/docstring.build.wanda.yaml
    depends_on: oss-ci-base_test-multipy(python=3.10)
    env:
      PYTHON: "3.10"
    tags: cibase

  # Runs instead of a library's test steps when the "docstring-only" label is
  # present: the >>> examples in the docstrings of only the modules the PR
  # changed, in every library, as plain Python with the PR's Ray
  # (ci/ray_ci/doc/run_docstring_examples.sh). It runs only modules a CPU
  # doctest() target covers, in the docstringbuild image, which leaves out
  # torch and TensorFlow; examples that need them are reported as skipped.
  # Their library's doctest() target covers them on builds without the label;
  # the label skips it with the rest of the library's suites. The label's
  # scope guard (lint: validate docstring-only scope) fails the build unless
  # the PR changes nothing but docstrings and comments.
  #
  # Tagged with every library tag a python/ray/ change can emit, so a labeled
  # PR selects it whatever it touches. The docstring-only rule in
  # docs.labels.yaml keeps it, by the docstring_examples tag, and skips it
  # without the label, so an unlabeled PR doesn't build docstringbuild.
  - label: ":book: doc: docstring examples"
    if: build.pull_request.labels includes "docstring-only"
    tags:
      - oss
      - docstring_examples
      - data
      - core_python
      - serve
      - ml
      - train
      - tune
      - rllib
      - llm
      - dashboard
      - workflow
    instance_type: medium
    commands:
      - ./ci/ray_ci/doc/run_docstring_examples.sh docstringbuild 3.10
    depends_on:
      - docstringbuild
      - ray-core-build(python=3.10)
      - ray-dashboard-build

  # Runs //doc:doctest, the catch-all doctest target for documentation prose that
  # no library owns (tagged team:none). The five per-library docs example steps
  # each filter on their own team:<lib>, so this is the only step that reaches it.
  #
  # Postmerge only. It was already postmerge-only before this comment existed, but
  # by accident rather than intent: the step carried the tag `python`, which no
  # .rules.txt file declares and no rule emits, so premerge tag selection dropped
  # it every time. `skip-on-premerge` states that intent explicitly, matching
  # `doc: build` and `doc: linkcheck` in doc.rayci.yml and the postmerge-only core
  # minimal-tests step in core.rayci.yml. `doc` is the build-and-validation tag,
  # which is what this step is; it does not re-enable the step on premerge, since
  # skip tags are rejected before tag selection runs.
  - label: "doc: doctest"
    tags:
      - oss
      - doc
      - skip-on-premerge
    instance_type: large
    commands:
      # Disable test DB to avoid any hidden failures going forward.
      - RAYCI_DISABLE_TEST_DB=1 bazel run //ci/ray_ci:test_in_docker -- //python/ray/... //doc/... none
        --build-name doctestbuild
        --only-tags doctest
        --except-tags gpu
        --parallelism-per-worker 3
        --python-version 3.10
    depends_on:
      - doctestbuild
      - ray-core-build(python=3.10)
      - ray-dashboard-build

  # Opt-in docs example tests, for the "docs-example-test" label. Runs only the
  # doc example tests that name a changed doc file directly, never a library's
  # whole docs example suite, and never GPU tests: docs examples don't need GPU
  # tests in premerge or microcheck. Every team's targets run once, in the one
  # doctestbuild environment, rather than in each library's own images. The
  # per-library docs example steps, with their own images, stay the coverage
  # for library code changes and postmerge. See
  # ci/ray_ci/doc/doc_example_targets.py. The docs-example-test rule in
  # docs.labels.yaml skips it without the label, by the doc_example_optin tag,
  # so an unlabeled PR doesn't build its images.
  - label: "doc: docs example tests (opt-in)"
    if: build.pull_request.labels includes "docs-example-test"
    tags:
      - oss
      - doc_example_optin
      - doc_example
    instance_type: large
    commands:
      - ./ci/ray_ci/doc/run_doc_example_tests.sh
        --build-name doctestbuild
        --python-version 3.10
        --except-tags gpu,post_wheel_build,highly_parallel,timeseries_libs
        --parallelism-per-worker 3
    depends_on:
      - doctestbuild
      - ray-core-build(python=3.10)
      - ray-dashboard-build

  # java
  - label: ":java: java tests"
    tags: java
    instance_type: medium
    commands:
      # Java tests need the C++ API for multi-langauge worker tests.
      - bazel run //ci/ray_ci:test_in_docker -- //... core --build-type multi-lang --build-only
        --python-version 3.10 --build-name corebuild-py3.10
      - docker run -i --rm --volume /tmp/artifacts:/artifact-mount --shm-size=2.5gb
        "$${RAYCI_WORK_REPO}":"$${RAYCI_BUILD_ID}"-corebuild-py3.10 /bin/bash -iecuo pipefail
        "./java/test.sh"
    depends_on: corebuild-multipy(python=3.10)

  # bot
  - label: ":robot_face: CI weekly green metric"
    tags:
      - skip-on-premerge
      - oss
    if: build.branch == "master"
    instance_type: small
    commands:
      - bazel run //ci/ray_ci/automation:weekly_green_metric -- --production

  - label: ":robot_face: {{matrix}} microcheck test coverage"
    tags:
      - skip-on-premerge
      - oss
    if: build.branch == "master"
    instance_type: small
    commands:
      - bazel run //ci/ray_ci/automation:determine_microcheck_tests -- {{matrix}} 100 --test-prefix linux:__ --production
      # we use master branch to determine microcheck tests for darwin and windows, because darwin and windows tests do not run on premerge branches
      - bazel run //ci/ray_ci/automation:determine_microcheck_tests -- {{matrix}} 100 --test-prefix darwin:__ --consider-master-branch --production
      - bazel run //ci/ray_ci/automation:determine_microcheck_tests -- {{matrix}} 100 --test-prefix windows:__ --consider-master-branch --production
    matrix:
      - "core"
      - "serve"
      - "data"
      - "ml"
      - "rllib"
      - "ci"

  - name: fossa-base
    wanda: ci/docker/fossa.wanda.yaml
    depends_on: forge

  - label: "fossa analyze"
    key: fossa-analyze
    tags:
      - skip-on-premerge
      - fossa
      - oss
    instance_type: small
    commands:
      - bash ci/fossa/analyze.sh
    depends_on: fossa-base
    job_env: fossa-base
