group: llm tests
depends_on:
  - forge
  - ray-core-build(*)
  - ray-dashboard-build
steps:
  - name: llmbuild
    wanda: ci/docker/llm.build.wanda.yaml
    depends_on:
      - oss-ci-base_build-multipy(python=3.12)
    env:
      PYTHON: "3.12"
      BASE_TYPE: "build"
      BUILD_VARIANT: "build"
      RAY_CUDA_CODE: "cpu"
    tags: cibase

  - label: "llm cpu tests"
    key: "llm-cpu-tests"
    tags:
      - llm
      - cpu
    instance_type: medium
    commands:
      - bazel run //ci/ray_ci:test_in_docker -- //python/ray/llm/... //doc/... llm
        --python-version 3.12 --build-name llmbuild
        --except-tags gpu
    depends_on: llmbuild
