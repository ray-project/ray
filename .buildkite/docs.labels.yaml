# PR label rules for rayci step selection. rayci reads every *.labels.yaml
# file in .buildkite/ and applies a rule when BUILDKITE_PULL_REQUEST_LABELS
# includes or lacks its label, before it marks step dependencies, so a step a
# rule drops takes the images only it needs with it.
#
#   keep_only_tags: with the label, a step runs only if the changed files
#     select it and it also carries one of these tags.
#   skip_tags_unless_present: without the label, steps carrying these tags are
#     skipped, along with any step that depends on them.

# A PR that changes nothing but docstrings and comments skips every library's
# test suites and runs the changed modules' >>> examples instead. Kept: steps
# tagged `always`, including the label's scope guard, lint, the two API
# surface checks (`doc_api`), and doc: docstring examples. Without the label,
# doc: docstring examples is skipped, so its image doesn't build.
- label: docstring-only
  keep_only_tags: [always, lint, doc_api, docstring_examples]
  skip_tags_unless_present: [docstring_examples]

# Opt-in docs example tests run only on a PR with the label.
- label: docs-example-test
  skip_tags_unless_present: [doc_example_optin]
